# Blueprint do Render. Código em app_medicamentos_sus.

databases:
  - name: mapeiasus-db
    plan: free
    postgresMajorVersion: "18"
    databaseName: mapeiasus
    user: mapeiasus

services:
  - type: web
    name: mapeiasus
    runtime: python
    plan: 0.5c-512mb # disco persistente exige plano pago
    numInstances: 1
    rootDir: app_medicamentos_sus
    buildCommand: "pip install -r requirements.txt && python scripts/seed.py && python scripts/bootstrap_admin.py"
    startCommand: "gunicorn --bind 0.0.0.0:$PORT --workers 1 --timeout 120 app:app"
    healthCheckPath: /health
    disk:
      name: mapeiasus-uploads
      mountPath: /opt/render/project/src/mapeiasus-uploads
      sizeGB: 1
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: mapeiasus-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: SESSION_COOKIE_SECURE
        value: "true"
      - key: REQUIRE_LOGIN
        value: "true"
      - key: ALLOW_REGISTRATION
        value: "true"
      - key: AUTO_CREATE_TABLES
        value: "true"
      - key: UPLOAD_FOLDER
        value: /opt/render/project/src/mapeiasus-uploads
      # Preenchidos no painel do Render:
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: ADMIN_EMAILS
        sync: false
      # Admin inicial (mesmo e-mail de ADMIN_EMAILS).
      - key: ADMIN_BOOTSTRAP_EMAIL
        sync: false
      - key: ADMIN_BOOTSTRAP_PASSWORD
        sync: false
