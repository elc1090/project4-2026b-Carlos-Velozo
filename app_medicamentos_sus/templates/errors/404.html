{% extends "base.html" %}

{% block title %}Página não encontrada — MapeiaSUS{% endblock %}

{% block content %}
<main class="auth-container">
    <div class="auth-card error-card">
        <div class="error-code">404</div>
        <h2>Página não encontrada</h2>
        <p>O endereço que você tentou acessar não existe ou foi movido.</p>
        <a class="btn btn-primary btn-block" href="{{ url_for('public.index') }}">
            <i class="fa-solid fa-arrow-left"></i> Voltar ao início
        </a>
    </div>
</main>
{% endblock %}
