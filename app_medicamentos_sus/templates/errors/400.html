{% extends "base.html" %}

{% block title %}Pedido inválido — MapeiaSUS{% endblock %}

{% block content %}
<main class="auth-container">
    <div class="auth-card error-card">
        <div class="error-code">400</div>
        <h2>Pedido inválido</h2>
        <p>{{ motivo or "Não foi possível validar o formulário. Tente novamente." }}</p>
        <a class="btn btn-primary btn-block" href="{{ url_for('public.index') }}">
            <i class="fa-solid fa-arrow-left"></i> Voltar ao início
        </a>
    </div>
</main>
{% endblock %}
